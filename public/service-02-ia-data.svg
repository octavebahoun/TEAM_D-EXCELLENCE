<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none" role="img" aria-labelledby="t2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t2">LLM en production : RAG, fine-tuning, sortie validée</title>
<style><![CDATA[
  .st{stroke:var(--ink,#0D0D0D);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .fl{fill:var(--ink,#0D0D0D)}
  .ac{fill:var(--accent,#ff4b12)}
  .acs{stroke:var(--accent,#ff4b12);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .q{opacity:.42}
  .qq{opacity:.2}

  .mesh{stroke:var(--ink,#0D0D0D);stroke-width:1;opacity:.22;stroke-dasharray:5 7;animation:flow 3.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}

  .comet{stroke-dasharray:28 460;animation:comet 3.2s linear infinite}
  @keyframes comet{from{stroke-dashoffset:28}to{stroke-dashoffset:-242}}

  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-out infinite}
  @keyframes pulse{0%,55%{transform:scale(1);opacity:.42}62%{transform:scale(1.55);opacity:1}80%,100%{transform:scale(1);opacity:.42}}
  .p1{animation-delay:.25s}.p2{animation-delay:.85s}.p3{animation-delay:1.45s}

  .line{transform-box:fill-box;transform-origin:left center;animation:type 3.2s cubic-bezier(.2,.8,.3,1) infinite}
  @keyframes type{0%,18%{transform:scaleX(0)}34%{transform:scaleX(1)}88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .l2{animation-delay:.18s}.l3{animation-delay:.36s}

  .check{stroke-dasharray:34;animation:draw 3.2s ease-out infinite}
  @keyframes draw{0%,62%{stroke-dashoffset:34}74%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:34}}

  .doc{animation:doc 3.2s ease-in-out infinite}
  @keyframes doc{0%,100%{opacity:.5}12%{opacity:1}40%{opacity:.5}}
  .g2{animation-delay:.3s}.g3{animation-delay:.6s}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>

<!-- sources de données -->
<g class="doc">
  <rect x="26" y="99" width="46" height="30" rx="6" class="st"/>
  <path d="M36 109h26M36 118h18" class="st q"/>
</g>
<g class="doc g2">
  <rect x="26" y="135" width="46" height="30" rx="6" class="st"/>
  <path d="M36 145h26M36 154h22" class="st q"/>
</g>
<g class="doc g3">
  <rect x="26" y="171" width="46" height="30" rx="6" class="st"/>
  <path d="M36 181h26M36 190h14" class="st q"/>
</g>

<!-- maillage -->
<path class="mesh" d="M74 114 132 105M74 114 132 135M74 114 132 165M74 114 132 195M74 150 132 105M74 150 132 135M74 150 132 165M74 150 132 195M74 186 132 105M74 186 132 135M74 186 132 165M74 186 132 195M132 105 210 90M132 105 210 120M132 105 210 150M132 135 210 120M132 135 210 150M132 135 210 180M132 165 210 150M132 165 210 180M132 165 210 210M132 195 210 150M132 195 210 180M132 195 210 210M210 90 284 150M210 120 284 150M210 150 284 150M210 180 284 150M210 210 284 150"/>

<!-- chemin actif -->
<path class="acs comet" d="M74 150 132 135 210 150 284 150"/>

<!-- neurones -->
<circle cx="132" cy="105" r="7.5" class="st q"/>
<circle cx="132" cy="135" r="7.5" class="st" opacity=".9"/>
<circle cx="132" cy="165" r="7.5" class="st q"/>
<circle cx="132" cy="195" r="7.5" class="st q"/>
<circle cx="210" cy="90" r="7.5" class="st q"/>
<circle cx="210" cy="120" r="7.5" class="st q"/>
<circle cx="210" cy="150" r="7.5" class="st" opacity=".9"/>
<circle cx="210" cy="180" r="7.5" class="st q"/>
<circle cx="210" cy="210" r="7.5" class="st q"/>

<circle cx="132" cy="135" r="3.2" class="ac pulse p1"/>
<circle cx="210" cy="150" r="3.2" class="ac pulse p2"/>
<circle cx="210" cy="120" r="3.2" class="ac pulse p3"/>

<!-- sortie validée -->
<rect x="284" y="104" width="90" height="92" rx="11" class="st"/>
<rect x="298" y="118" width="38" height="8" rx="4" class="ac"/>
<rect x="298" y="139" width="60" height="7" rx="3.5" class="fl qq line"/>
<rect x="298" y="153" width="44" height="7" rx="3.5" class="fl qq line l2"/>
<rect x="298" y="167" width="54" height="7" rx="3.5" class="fl qq line l3"/>
<path d="M298 181.5l6 6.5 12-13.5" class="acs check"/>
</svg>
