<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none" role="img" aria-labelledby="t1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t1">Application web et SaaS</title>
<style><![CDATA[
  .st{stroke:var(--ink,#9a9a9a);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .fl{fill:var(--ink,#9a9a9a)}
  .ac{fill:var(--accent,#ff4b12)}
  .acs{stroke:var(--accent,#ff4b12);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .q{opacity:.42}
  .qq{opacity:.22}
  .in{animation:in 7s cubic-bezier(.2,.75,.3,1) infinite}
  @keyframes in{
    0%{opacity:0;transform:translateY(9px)}
    7%{opacity:1;transform:translateY(0)}
    80%{opacity:1;transform:translateY(0)}
    88%,100%{opacity:0;transform:translateY(-7px)}
  }
  .d1{animation-delay:.2s}.d2{animation-delay:.36s}.d3{animation-delay:.52s}
  .d4{animation-delay:.68s}.d5{animation-delay:.84s}.d6{animation-delay:1s}.d7{animation-delay:1.16s}
  .bar{transform-box:fill-box;transform-origin:left center;animation:load 7s cubic-bezier(.65,0,.35,1) infinite}
  @keyframes load{0%{transform:scaleX(.02)}18%{transform:scaleX(.35)}55%{transform:scaleX(.72)}78%,92%{transform:scaleX(1)}100%{transform:scaleX(.02)}}
  .cur{animation:cur 7s cubic-bezier(.45,0,.2,1) infinite}
  @keyframes cur{
    0%,8%{transform:translate(300px,216px)}
    34%,50%{transform:translate(224px,178px)}
    72%{transform:translate(284px,128px)}
    100%{transform:translate(300px,216px)}
  }
  .rip{transform-box:fill-box;transform-origin:center;animation:rip 7s linear infinite}
  @keyframes rip{0%,36%{opacity:0;transform:scale(.25)}40%{opacity:.85;transform:scale(.45)}54%,100%{opacity:0;transform:scale(1.35)}}
  .blink{animation:blink 7s steps(1,end) infinite}
  @keyframes blink{0%,36%{opacity:.42}40%{opacity:1}54%{opacity:1}56%,100%{opacity:.42}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>

<!-- fenêtre navigateur -->
<g class="in">
  <rect x="46" y="52" width="308" height="196" rx="13" class="st"/>
  <path d="M46 84h308" class="st q"/>
</g>
<g class="in d1">
  <circle cx="66" cy="68" r="3.6" class="ac"/>
  <circle cx="78" cy="68" r="3.6" class="fl q"/>
  <circle cx="90" cy="68" r="3.6" class="fl q"/>
</g>
<rect x="120" y="61" width="130" height="14" rx="7" class="st qq in d2"/>

<!-- navigation latérale -->
<path d="M112 84v164" class="st q in d2"/>
<rect x="62" y="100" width="36" height="7" rx="3.5" class="ac in d3"/>
<rect x="62" y="118" width="30" height="7" rx="3.5" class="fl q in d3"/>
<rect x="62" y="136" width="34" height="7" rx="3.5" class="fl q in d4"/>
<rect x="62" y="154" width="24" height="7" rx="3.5" class="fl q in d4"/>

<!-- bloc principal -->
<g class="in d3">
  <rect x="126" y="100" width="212" height="52" rx="9" class="st q"/>
  <rect x="140" y="114" width="76" height="9" rx="4.5" class="ac"/>
  <rect x="140" y="131" width="132" height="7" rx="3.5" class="fl qq"/>
</g>

<!-- modules -->
<g class="in d4">
  <rect x="126" y="164" width="64" height="54" rx="9" class="st q"/>
  <circle cx="142" cy="180" r="5" class="fl q"/>
  <rect x="138" y="194" width="40" height="6" rx="3" class="fl qq"/>
  <rect x="138" y="204" width="26" height="6" rx="3" class="fl qq"/>
</g>
<g class="in d5">
  <rect x="200" y="164" width="64" height="54" rx="9" class="st blink"/>
  <circle cx="216" cy="180" r="5" class="ac"/>
  <rect x="212" y="194" width="40" height="6" rx="3" class="fl qq"/>
  <rect x="212" y="204" width="30" height="6" rx="3" class="fl qq"/>
</g>
<g class="in d6">
  <rect x="274" y="164" width="64" height="54" rx="9" class="st q"/>
  <circle cx="290" cy="180" r="5" class="fl q"/>
  <rect x="286" y="194" width="36" height="6" rx="3" class="fl qq"/>
  <rect x="286" y="204" width="24" height="6" rx="3" class="fl qq"/>
</g>
<rect x="126" y="228" width="146" height="7" rx="3.5" class="fl qq in d7"/>

<!-- clic -->
<circle cx="232" cy="191" r="15" class="acs rip" opacity="0"/>

<!-- mise en production -->
<rect x="46" y="266" width="308" height="5" rx="2.5" class="fl" opacity=".16"/>
<rect x="46" y="266" width="308" height="5" rx="2.5" class="ac bar"/>

<!-- curseur -->
<g class="cur" transform="translate(300,216)">
  <path d="M0 0v15.4l4.3-4.1 2.8 5.5 2.7-1.3-2.7-5.3 5.2-.3z" class="ac"/>
</g>
</svg>
