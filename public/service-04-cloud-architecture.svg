<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none" role="img" aria-labelledby="t4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t4">Infrastructure, déploiement continu et services open source</title>
<style><![CDATA[
  .st{stroke:var(--ink,#0D0D0D);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .fl{fill:var(--ink,#0D0D0D)}
  .ac{fill:var(--accent,#ff4b12)}
  .acs{stroke:var(--accent,#ff4b12);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .q{opacity:.42}
  .qq{opacity:.2}

  .rail{stroke:var(--ink,#0D0D0D);stroke-width:1.4;opacity:.3;stroke-dasharray:4 7;animation:flow 2.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-22}}

  .packet{animation:packet 6s cubic-bezier(.55,0,.35,1) infinite}
  @keyframes packet{
    0%{transform:translateX(0);opacity:0}
    4%{opacity:1}
    6%{transform:translateX(0)}
    26%,36%{transform:translateX(116px)}
    56%,68%{transform:translateX(232px);opacity:1}
    74%,100%{transform:translateX(232px);opacity:0}
  }

  .s1{animation:s1 6s linear infinite}
  @keyframes s1{0%,3%{opacity:0}6%,24%{opacity:1}28%,100%{opacity:0}}
  .s2{animation:s2 6s linear infinite}
  @keyframes s2{0%,24%{opacity:0}28%,52%{opacity:1}56%,100%{opacity:0}}
  .s3{animation:s3 6s linear infinite}
  @keyframes s3{0%,54%{opacity:0}58%,74%{opacity:1}78%,100%{opacity:0}}

  .orbit{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
  .orbit-r{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}

  .glow{transform-box:fill-box;transform-origin:center;animation:glow 6s ease-out infinite}
  @keyframes glow{0%,64%{opacity:.55;transform:scale(1)}72%{opacity:1;transform:scale(1.22)}88%,100%{opacity:.55;transform:scale(1)}}

  .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 6s ease-out infinite}
  @keyframes ripple{0%,66%{opacity:0;transform:scale(.3)}72%{opacity:.75;transform:scale(.55)}92%,100%{opacity:0;transform:scale(1.45)}}

  .node{animation:node 6s ease-in-out infinite}
  @keyframes node{0%,60%{opacity:.4}76%{opacity:1}96%,100%{opacity:.4}}
  .n2{animation-delay:.12s}.n3{animation-delay:.24s}.n4{animation-delay:.36s}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>

<!-- chaîne d'intégration continue -->
<path class="rail" d="M100 56h84M216 56h84"/>

<circle cx="84" cy="56" r="14" class="st q"/>
<circle cx="84" cy="56" r="14" class="acs s1" opacity="0"/>
<circle cx="84" cy="56" r="4" class="fl q"/>

<circle cx="200" cy="56" r="14" class="st q"/>
<circle cx="200" cy="56" r="14" class="acs s2" opacity="0"/>
<path d="M194 52h12M194 60h8" class="st q"/>

<circle cx="316" cy="56" r="14" class="st q"/>
<circle cx="316" cy="56" r="14" class="acs s3" opacity="0"/>
<path d="M311 61l10-10M314.5 51H321v6.5" class="st q"/>

<rect x="79.5" y="51.5" width="9" height="9" rx="2.5" class="ac packet" opacity="0"/>

<!-- orbites -->
<circle cx="200" cy="192" r="56" class="st orbit" stroke-dasharray="3 10" opacity=".34"/>
<circle cx="200" cy="192" r="42" class="st orbit-r" stroke-dasharray="2 12" opacity=".2"/>

<!-- liaisons -->
<path class="rail" d="M224 168 245 147M176 168 155 147M224 216 245 237M176 216 155 237"/>

<!-- coeur -->
<rect x="178" y="170" width="44" height="44" rx="11" class="st"/>
<rect x="192" y="184" width="16" height="16" rx="4.5" class="ac glow"/>
<circle cx="200" cy="192" r="34" class="acs ripple" opacity="0"/>

<!-- services -->
<g class="node">
  <rect x="120" y="117" width="38" height="28" rx="7" class="st"/>
  <circle cx="132" cy="131" r="3.2" class="ac"/>
  <path d="M140 131h10" class="st q"/>
</g>
<g class="node n2">
  <rect x="242" y="117" width="38" height="28" rx="7" class="st"/>
  <path d="M252 126h18M252 132h12M252 138h16" class="st q"/>
</g>
<g class="node n3">
  <rect x="120" y="239" width="38" height="28" rx="7" class="st"/>
  <path d="M130 247h18M130 253h18M130 259h10" class="st q"/>
</g>
<g class="node n4">
  <rect x="242" y="239" width="38" height="28" rx="7" class="st"/>
  <circle cx="254" cy="253" r="3.2" class="ac"/>
  <path d="M262 253h10" class="st q"/>
</g>
</svg>
