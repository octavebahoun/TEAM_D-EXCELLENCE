  <circle cx="62" cy="117" r="11" class="st q"/>
  <circle cx="62" cy="114" r="3.6" class="fl q"/>
  <path d="M55.5 123.5a7.5 7.5 0 0 1 13 0" class="st q"/>
  <rect x="84" y="109" width="84" height="8" rx="4" class="fl q"/>
  <rect x="84" y="123" width="56" height="6" rx="3" class="fl qq"/>
  <rect x="210" y="108" width="56" height="20" rx="10" class="st pill"/>
  <path d="M222 118.5l4 4.5 9-10" class="acs tick"/>
</g>
<g class="row r2">
  <circle cx="62" cy="155" r="11" class="st q"/>
  <circle cx="62" cy="152" r="3.6" class="fl q"/>
  <path d="M55.5 161.5a7.5 7.5 0 0 1 13 0" class="st q"/>
  <rect x="84" y="147" width="70" height="8" rx="4" class="fl q"/>
  <rect x="84" y="161" width="46" height="6" rx="3" class="fl qq"/>
  <rect x="210" y="146" width="56" height="20" rx="10" class="st pill r2"/>
  <path d="M222 156.5l4 4.5 9-10" class="acs tick t2"/>
</g>
<g class="row r3">
  <circle cx="62" cy="193" r="11" class="st q"/>
  <circle cx="62" cy="190" r="3.6" class="fl q"/>
  <path d="M55.5 199.5a7.5 7.5 0 0 1 13 0" class="st q"/>
  <rect x="84" y="185" width="92" height="8" rx="4" class="fl q"/>
  <rect x="84" y="199" width="60" height="6" rx="3" class="fl qq"/>
  <rect x="210" y="184" width="56" height="20" rx="10" class="st pill r3"/>
  <path d="M222 194.5l4 4.5 9-10" class="acs tick t3"/>
</g>
<g class="row r4">
  <circle cx="62" cy="231" r="11" class="st q"/>
  <circle cx="62" cy="228" r="3.6" class="fl q"/>
  <path d="M55.5 237.5a7.5 7.5 0 0 1 13 0" class="st q"/>
  <rect x="84" y="223" width="62" height="8" rx="4" class="fl q"/>
  <rect x="84" y="237" width="52" height="6" rx="3" class="fl qq"/>
  <rect x="210" y="222" width="56" height="20" rx="10" class="st pill r4"/>
  <path d="M222 232.5l4 4.5 9-10" class="acs tick t4"/>
</g>

<!-- suivi -->
<rect x="296" y="48" width="68" height="204" rx="12" class="st"/>
<circle cx="330" cy="94" r="22" class="st qq"/>
<circle cx="330" cy="94" r="22" class="acs ring"/>
<circle cx="330" cy="94" r="4" class="ac"/>

<rect x="310" y="198" width="10" height="34" rx="3" class="fl q bar"/>
<rect x="326" y="176" width="10" height="56" rx="3" class="ac bar b2"/>
<rect x="342" y="160" width="10" height="72" rx="3" class="fl q bar b3"/>
<path d="M306 238h48" class="st qq"/>
</svg>
