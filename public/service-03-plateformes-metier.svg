<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none" role="img" aria-labelledby="t3" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t3">Gestion des membres, notes et suivi</title>
<style><![CDATA[
  .st{stroke:var(--ink,#0D0D0D);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .fl{fill:var(--ink,#0D0D0D)}
  .ac{fill:var(--accent,#ff4b12)}
  .acs{stroke:var(--accent,#ff4b12);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .q{opacity:.42}
  .qq{opacity:.2}

  .row{animation:row 8s cubic-bezier(.2,.8,.3,1) infinite}
  @keyframes row{
    0%{opacity:0;transform:translateX(-16px)}
    8%{opacity:1;transform:translateX(0)}
    84%{opacity:1;transform:translateX(0)}
    92%,100%{opacity:0;transform:translateX(10px)}
  }
  .r2{animation-delay:.5s}.r3{animation-delay:1s}.r4{animation-delay:1.5s}

  .tick{stroke-dasharray:26;animation:tick 8s ease-out infinite}
  @keyframes tick{0%,14%{stroke-dashoffset:26}22%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:26}}
  .t2{animation-delay:.5s}.t3{animation-delay:1s}.t4{animation-delay:1.5s}

  .pill{animation:pill 8s ease-out infinite}
  @keyframes pill{0%,12%{opacity:.18}22%,86%{opacity:.9}100%{opacity:.18}}

  .ring{transform-box:fill-box;transform-origin:center;transform:rotate(-90deg);stroke-dasharray:138.2;animation:ring 8s cubic-bezier(.3,.7,.3,1) infinite}
  @keyframes ring{0%{stroke-dashoffset:138.2}30%,86%{stroke-dashoffset:38}100%{stroke-dashoffset:138.2}}

  .bar{transform-box:fill-box;transform-origin:center bottom;animation:bar 8s cubic-bezier(.2,.8,.3,1) infinite}
  @keyframes bar{0%,6%{transform:scaleY(.05)}26%,88%{transform:scaleY(1)}100%{transform:scaleY(.05)}}
  .b2{animation-delay:.16s}.b3{animation-delay:.32s}

  .caret{animation:caret 1.1s steps(1,end) infinite}
  @keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>

<!-- panneau principal -->
<rect x="36" y="48" width="248" height="204" rx="12" class="st"/>
<rect x="54" y="64" width="72" height="9" rx="4.5" class="ac"/>
<rect x="186" y="59" width="80" height="19" rx="9.5" class="st q"/>
<circle cx="200" cy="68.5" r="4" class="st q"/>
<path d="M203 71.5l3 3" class="st q"/>
<rect x="228" y="65" width="24" height="7" rx="3.5" class="fl qq caret"/>
<path d="M36 92h248" class="st q"/>

<!-- membres -->
